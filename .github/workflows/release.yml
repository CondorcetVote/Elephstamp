name: Release PHAR and Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the PHAR to (e.g. v1.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  phar:
    runs-on: ubuntu-latest

    permissions:
      contents: write # upload the release assets
      id-token: write # sign the build provenance attestation
      attestations: write

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none
          tools: box:4.7.0

      # The version shown by `elephstamp --version` comes from Composer's
      # installed.php, which records the root version given here.
      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader
        env:
          COMPOSER_ROOT_VERSION: ${{ env.TAG }}

      - name: Compile PHAR
        run: box compile

      - name: Smoke test
        run: |
          test "$(php build/elephstamp.phar --version)" = "ElephStamp ${TAG}"
          php build/elephstamp.phar calendars
          php build/elephstamp.phar info tests/fixtures/hello-world.txt.ots
          php build/elephstamp.phar tree tests/fixtures/hello-world.txt.ots > /dev/null

      - name: Checksum
        working-directory: build
        run: sha256sum elephstamp.phar | tee elephstamp.phar.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/elephstamp.phar

      - name: Upload to the release
        run: gh release upload "$TAG" build/elephstamp.phar build/elephstamp.phar.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Hand the PHAR over to the Docker job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elephstamp.phar
          path: build/elephstamp.phar
          if-no-files-found: error

  docker:
    needs: phar
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # sign the build provenance attestation
      attestations: write

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: docker.io/julienboudry/elephstamp
      # Floating tags (1.4, 1, latest) only follow a genuine, final release:
      # rebuilding an older tag by hand must not move them backwards.
      FLOATING: ${{ github.event_name == 'release' && !github.event.release.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Get the PHAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: elephstamp.phar
          path: build

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ env.FLOATING }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.FLOATING }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ env.FLOATING }}

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: elephstamp:smoke-test
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          test "$(docker run --rm elephstamp:smoke-test --version)" = "ElephStamp ${TAG}"
          docker run --rm --entrypoint php elephstamp:smoke-test \
            -r 'exit(extension_loaded("curl") && extension_loaded("mbstring") ? 0 : 1);'
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/tests/fixtures:/data" \
            elephstamp:smoke-test info hello-world.txt.ots

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image only copies the PHAR (no RUN step), so other platforms
      # build without emulation.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
